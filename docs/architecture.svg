<svg width="860" height="480" viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
    <marker id="arwv" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="480" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#24292f">Antigravity Gemini MCP — Architecture</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#57606a">Gemini app as the UI  ·  zero app install  ·  standard remote MCP (OAuth 2.1 + PKCE)</text>

  <!-- Left zone: Phone -->
  <rect x="30" y="90" width="220" height="300" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="140" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">📱 Phone</text>
  <text x="140" y="134" text-anchor="middle" font-size="11" fill="#57606a">Gemini app (already installed)</text>

  <rect x="52" y="152" width="176" height="44" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="140" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">Type: "update the middleware"</text>

  <rect x="52" y="210" width="176" height="44" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="140" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">Search + reason (Gemini cloud)</text>

  <rect x="52" y="268" width="176" height="44" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="140" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">Reply with diff / result</text>

  <text x="140" y="356" text-anchor="middle" font-size="10.5" fill="#6e7781">nothing to install · nothing to keep open</text>

  <!-- Middle: Gemini cloud + network -->
  <rect x="282" y="120" width="296" height="54" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="430" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">Gemini cloud</text>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#57606a">custom MCP connector (official support since Jun 2026)</text>

  <rect x="282" y="240" width="296" height="54" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="430" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">Public HTTPS endpoint</text>
  <text x="430" y="280" text-anchor="middle" font-size="11" fill="#57606a">Cloudflare Tunnel or VPS Nginx · trusted certificate</text>

  <!-- Right: Host -->
  <rect x="610" y="90" width="220" height="300" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="720" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">🖥️ Windows host</text>
  <text x="720" y="134" text-anchor="middle" font-size="11" fill="#57606a">any powered-on machine</text>

  <rect x="632" y="152" width="176" height="44" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="720" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">gateway.py + mcp_bridge.py</text>
  <text x="720" y="184" text-anchor="middle" font-size="10" fill="#57606a">MCP server · :18900 · OAuth</text>

  <rect x="632" y="210" width="176" height="44" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="720" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">agentapi.bat</text>

  <rect x="632" y="268" width="176" height="60" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="720" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">Antigravity IDE</text>
  <text x="720" y="308" text-anchor="middle" font-size="10" fill="#57606a">agent runs · files on disk</text>

  <text x="720" y="356" text-anchor="middle" font-size="10.5" fill="#6e7781">your quota · your workspace</text>

  <!-- Arrows -->
  <line x1="256" y1="182" x2="278" y2="182" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="430" y1="178" x2="430" y2="236" stroke="#57606a" stroke-width="2" marker-end="url(#arwv)"/>
  <line x1="582" y1="182" x2="606" y2="182" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="282" y1="268" x2="258" y2="268" stroke="#57606a" stroke-width="2" marker-end="url(#arwv)"/>

  <text x="430" y="455" text-anchor="middle" font-size="11" fill="#6e7781">One conversation where Gemini searches the web, dispatches the task, and shows you the result — the IDE remote can't do that.</text>
</svg>